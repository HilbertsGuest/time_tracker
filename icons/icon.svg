<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#333333" rx="80"/>

  <!-- Clock circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="20"/>

  <!-- Clock hands -->
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#4CAF50" stroke-width="16" stroke-linecap="round"/>

  <!-- Minute hand -->
  <line x1="256" y1="256" x2="320" y2="256" stroke="#4CAF50" stroke-width="12" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#4CAF50"/>

  <!-- Clock markers -->
  <circle cx="256" cy="96" r="8" fill="#ffffff"/>
  <circle cx="256" cy="416" r="8" fill="#ffffff"/>
  <circle cx="96" cy="256" r="8" fill="#ffffff"/>
  <circle cx="416" cy="256" r="8" fill="#ffffff"/>
</svg>
