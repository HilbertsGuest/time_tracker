<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track study hours across university modules with weekly goals and insights">
    <meta name="theme-color" content="#333333">
    <title>Time Tracker - Study Hours Manager</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <!-- Local JavaScript Libraries -->
    <script src="./js/react.production.min.js"></script>
    <script src="./js/react-dom.production.min.js"></script>
    <script src="./js/babel.min.js"></script>
    <script src="./js/chart.min.js"></script>
    <script src="./js/db.js"></script>

    <!-- Tailwind CSS CDN for development -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              success: '#4CAF50',
            }
          }
        }
      }
    </script>

    <style>
        /* Chart center text positioning - custom CSS needed for absolute positioning */
        .chart-center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        /* Custom scrollbar styling */
        .archive-timeline::-webkit-scrollbar {
            width: 8px;
        }

        .archive-timeline::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .archive-timeline::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .archive-timeline::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Slide in animation */
        @keyframes slideIn {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .pwa-status.show {
            animation: slideIn 0.3s ease-out;
        }

        /* KW badge gradient */
        .kw-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="m-0 p-0 font-sans bg-gray-100 text-gray-800">
    <div id="root"></div>
    <div id="pwa-status" class="fixed bottom-5 right-5 bg-gray-800 text-white px-5 py-3 rounded shadow-lg text-sm hidden z-50"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function TimeTracker() {
            // Program definitions with modules and weekly goals (in hours)
            const programs = {
                'Informatik': {
                    modules: {
                        'Diskrete Strukturen': { goal: 8, color: '#3498db' },
                        'Analysis für Informatik': { goal: 12, color: '#e74c3c' },
                        'Programmierung': { goal: 12, color: '#2ecc71' },
                        'Technische Informatik': { goal: 8, color: '#f39c12' },
                        'Mentoring Informatik': { goal: 2, color: '#9b59b6' }
                    }
                },
                'Maschinenbau': {
                    modules: {
                        'Buchführung und Internes Rechnungswesen': { goal: 6, color: '#3498db' },
                        'Entscheidungslehre': { goal: 6, color: '#e74c3c' },
                        'Maschinengestaltung I': { goal: 4, color: '#2ecc71' },
                        'Mathematik I': { goal: 10, color: '#f39c12' },
                        'Mechanik I': { goal: 10, color: '#9b59b6' },
                        'Physik': { goal: 4, color: '#e67e22' }
                    }
                }
            };

            const [activeProgram, setActiveProgram] = useState(() => {
                return localStorage.getItem('activeProgram') || 'Informatik';
            });
            const [tasks, setTasks] = useState([]);
            const [activeTab, setActiveTab] = useState('overview');
            const [viewMode, setViewMode] = useState('current');
            const [archivedWeeks, setArchivedWeeks] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [editingTask, setEditingTask] = useState(null);
            const [activeTimer, setActiveTimer] = useState(null);
            const [installPrompt, setInstallPrompt] = useState(null);
            const [dataLoaded, setDataLoaded] = useState(false);
            const [openMenuWeekId, setOpenMenuWeekId] = useState(null);
            const [hamburgerMenuOpen, setHamburgerMenuOpen] = useState(false);
            const [editLayoutMode, setEditLayoutMode] = useState(false);
            const [sectionOrder, setSectionOrder] = useState(() => {
                const saved = localStorage.getItem('sectionOrder');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Validate: must be array of exactly 2 items, only 'timer' and 'task-list'
                    if (Array.isArray(parsed) && parsed.length === 2 &&
                        parsed.includes('timer') && parsed.includes('task-list')) {
                        return parsed;
                    }
                }
                // Clear invalid data and return default (task-list next to chart)
                localStorage.removeItem('sectionOrder');
                return ['task-list', 'timer'];
            });
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Convenience variable for the active program's modules
            const modules = programs[activeProgram].modules;

            const [formData, setFormData] = useState({
                name: '',
                project: Object.keys(programs[activeProgram].modules)[0],
                start: '',
                end: ''
            });

            // Save active program to localStorage when it changes
            useEffect(() => {
                localStorage.setItem('activeProgram', activeProgram);
                loadDataFromDB();
            }, [activeProgram]);

            // Load data from IndexedDB on mount
            useEffect(() => {
                loadDataFromDB();
            }, []);

            // Save data to IndexedDB whenever tasks or archivedWeeks change
            useEffect(() => {
                if (dataLoaded) {
                    const saveData = async () => {
                        try {
                            console.log(`Saving tasks for ${activeProgram}:`, tasks.length, 'tasks');
                            console.log(`Saving archived weeks for ${activeProgram}:`, archivedWeeks.length, 'weeks');
                            await timeTrackerDB.saveTasks(tasks, activeProgram);
                            await timeTrackerDB.saveArchivedWeeks(archivedWeeks, activeProgram);
                            console.log(`Data saved successfully for ${activeProgram}`);
                        } catch (error) {
                            console.error('Error saving data:', error);
                        }
                    };
                    saveData();
                }
            }, [tasks, archivedWeeks, dataLoaded, activeProgram]);

            // Load data from IndexedDB for the active program
            const loadDataFromDB = async () => {
                try {
                    const loadedTasks = await timeTrackerDB.loadTasks(activeProgram);
                    const loadedArchives = await timeTrackerDB.loadArchivedWeeks(activeProgram);

                    console.log(`Loaded tasks from DB for ${activeProgram}:`, loadedTasks.length);
                    console.log(`Loaded archives from DB for ${activeProgram}:`, loadedArchives.length);

                    // Load tasks from database (empty array if none exist)
                    setTasks(loadedTasks);
                    setArchivedWeeks(loadedArchives);

                    setDataLoaded(true);
                    showPWAStatus(`Data loaded for ${activeProgram}`);
                } catch (error) {
                    console.error('Error loading data:', error);
                    setDataLoaded(true);
                }
            };

            // Show PWA status message
            const showPWAStatus = (message) => {
                const statusEl = document.getElementById('pwa-status');
                if (statusEl) {
                    statusEl.textContent = message;
                    statusEl.classList.add('show');
                    setTimeout(() => {
                        statusEl.classList.remove('show');
                    }, 3000);
                }
            };

            useEffect(() => {
                renderChart();
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [tasks, activeTab]);

            useEffect(() => {
                let interval;
                if (activeTimer && !activeTimer.isPaused) {
                    interval = setInterval(() => {
                        setActiveTimer(prev => ({
                            ...prev,
                            elapsed: Math.floor((Date.now() - prev.startTime) / 1000) + (prev.pausedElapsed || 0)
                        }));
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [activeTimer]);

            // PWA Install Prompt Handler
            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setInstallPrompt(e);
                    const installBtn = document.getElementById('install-btn');
                    if (installBtn) installBtn.style.display = 'block';
                };

                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

                return () => {
                    window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                };
            }, []);

            // Close dropdown menu when clicking outside
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (openMenuWeekId && !event.target.closest('.archive-week-card')) {
                        setOpenMenuWeekId(null);
                    }
                };

                if (openMenuWeekId) {
                    document.addEventListener('click', handleClickOutside);
                }

                return () => {
                    document.removeEventListener('click', handleClickOutside);
                };
            }, [openMenuWeekId]);

            // Close hamburger menu when clicking outside
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (hamburgerMenuOpen && !event.target.closest('.hamburger-menu-container')) {
                        setHamburgerMenuOpen(false);
                    }
                };

                if (hamburgerMenuOpen) {
                    document.addEventListener('click', handleClickOutside);
                }

                return () => {
                    document.removeEventListener('click', handleClickOutside);
                };
            }, [hamburgerMenuOpen]);

            const handleInstallClick = async () => {
                if (!installPrompt) return;

                const result = await installPrompt.prompt();
                console.log('Install prompt result:', result);

                setInstallPrompt(null);
                const installBtn = document.getElementById('install-btn');
                if (installBtn) installBtn.style.display = 'none';
            };

            const getProjectData = (filterModule = null) => {
                let filteredTasks = tasks;

                if (filterModule && filterModule !== 'overview') {
                    filteredTasks = tasks.filter(task => task.project === filterModule);
                }

                const projectTotals = {};
                filteredTasks.forEach(task => {
                    if (!projectTotals[task.project]) {
                        projectTotals[task.project] = 0;
                    }
                    projectTotals[task.project] += task.time;
                });

                const total = Object.values(projectTotals).reduce((sum, time) => sum + time, 0);
                const colors = Object.keys(projectTotals).map(proj => modules[proj]?.color || '#95a5a6');

                return {
                    labels: Object.keys(projectTotals),
                    datasets: [{
                        data: Object.values(projectTotals),
                        backgroundColor: colors,
                        borderWidth: 0
                    }],
                    total: total
                };
            };

            const getWeeklyGoalProgress = (moduleName) => {
                const moduleGoal = modules[moduleName].goal * 3600;
                const moduleTasks = tasks.filter(task => task.project === moduleName);
                const totalTime = moduleTasks.reduce((sum, task) => sum + task.time, 0);
                const percentage = (totalTime / moduleGoal) * 100;
                return {
                    current: totalTime,
                    goal: moduleGoal,
                    percentage: Math.min(percentage, 100)
                };
            };

            const getTotalWeeklyGoal = () => {
                const totalGoal = Object.values(modules).reduce((sum, mod) => sum + mod.goal, 0) * 3600;
                const totalTime = tasks.reduce((sum, task) => sum + task.time, 0);
                return {
                    current: totalTime,
                    goal: totalGoal,
                    percentage: (totalTime / totalGoal) * 100
                };
            };

            const getWeekNumber = (date) => {
                const d = new Date(date);
                d.setHours(0, 0, 0, 0);
                d.setDate(d.getDate() + 4 - (d.getDay() || 7));
                const yearStart = new Date(d.getFullYear(), 0, 1);
                const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
                return weekNo;
            };

            const getCurrentWeekDates = () => {
                const now = new Date();
                const dayOfWeek = now.getDay();
                const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                const monday = new Date(now);
                monday.setDate(now.getDate() + diff);
                monday.setHours(0, 0, 0, 0);

                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                sunday.setHours(23, 59, 59, 999);

                return { start: monday, end: sunday };
            };

            const archiveCurrentWeek = () => {
                if (tasks.length === 0) {
                    alert('No tasks to archive!');
                    return;
                }

                const sortedTasks = [...tasks].sort((a, b) => new Date(a.start) - new Date(b.start));
                const oldestTask = sortedTasks[0];
                const oldestDate = new Date(oldestTask.start);

                const dayOfWeek = oldestDate.getDay();
                const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                const monday = new Date(oldestDate);
                monday.setDate(oldestDate.getDate() + diff);
                monday.setHours(0, 0, 0, 0);

                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                sunday.setHours(23, 59, 59, 999);

                const weekTasks = tasks.filter(task => {
                    const taskDate = new Date(task.start);
                    return taskDate >= monday && taskDate <= sunday;
                });

                if (weekTasks.length === 0) {
                    alert('No tasks found in the oldest week to archive!');
                    return;
                }

                const totals = {};
                Object.keys(modules).forEach(mod => {
                    const moduleTasks = weekTasks.filter(t => t.project === mod);
                    const hours = moduleTasks.reduce((sum, t) => sum + t.time, 0) / 3600;
                    totals[mod] = hours;
                });

                const totalHours = Object.values(totals).reduce((sum, h) => sum + h, 0);
                const kw = getWeekNumber(monday);

                const archivedWeek = {
                    kw: kw,
                    year: monday.getFullYear(),
                    startDate: monday.toISOString().split('T')[0],
                    endDate: sunday.toISOString().split('T')[0],
                    tasks: weekTasks,
                    totals: totals,
                    totalHours: parseFloat(totalHours.toFixed(1))
                };

                setArchivedWeeks(prev => [...prev, archivedWeek]);

                const remainingTasks = tasks.filter(task => {
                    const taskDate = new Date(task.start);
                    return !(taskDate >= monday && taskDate <= sunday);
                });

                setTasks(remainingTasks);

                showPWAStatus(`Archived KW ${kw} with ${weekTasks.length} tasks!`);
            };

            const isCurrentWeek = (week) => {
                const now = new Date();
                const currentWeekStart = getCurrentWeekDates().start;
                const currentWeekEnd = getCurrentWeekDates().end;

                const weekStart = new Date(week.startDate);
                const weekEnd = new Date(week.endDate);

                // Check if the archived week matches the current week
                return weekStart.getTime() === currentWeekStart.getTime() &&
                       weekEnd.getTime() === currentWeekEnd.getTime();
            };

            const unarchiveWeek = (week) => {
                if (!isCurrentWeek(week)) {
                    alert('Can only unarchive the current week!');
                    return;
                }

                // Restore tasks to main task list
                const restoredTasks = week.tasks || [];
                setTasks(prev => [...prev, ...restoredTasks]);

                // Remove from archived weeks
                setArchivedWeeks(prev => prev.filter(w =>
                    !(w.kw === week.kw && w.year === week.year)
                ));

                setOpenMenuWeekId(null);
                showPWAStatus(`Unarchived KW ${week.kw} - ${restoredTasks.length} tasks restored!`);
            };

            const deleteArchivedWeek = (week) => {
                const confirmMessage = `Are you sure you want to permanently delete KW ${week.kw} (${week.year})?\n\nThis will delete ${week.tasks.length} task(s) and cannot be undone!`;

                if (confirm(confirmMessage)) {
                    // Remove from archived weeks
                    setArchivedWeeks(prev => prev.filter(w =>
                        !(w.kw === week.kw && w.year === week.year)
                    ));

                    setOpenMenuWeekId(null);
                    showPWAStatus(`Deleted KW ${week.kw} permanently!`);
                }
            };

            const renderChart = () => {
                if (!chartRef.current) return;

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const data = getProjectData(activeTab === 'overview' ? null : activeTab);
                const ctx = chartRef.current.getContext('2d');

                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        cutout: '75%',
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const timeFormatted = formatTime(context.raw);
                                        const percent = ((context.raw / data.total) * 100).toFixed(1);
                                        return `${context.label}: ${timeFormatted} (${percent}%)`;
                                    }
                                }
                            }
                        }
                    }
                });
            };

            const formatTime = (seconds) => {
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);

                // Display only minutes if less than 1 hour
                if (hours === 0) {
                    return `${minutes}m`;
                }
                return `${hours}h ${minutes}m`;
            };

            const formatDateTime = (dateString) => {
                const date = new Date(dateString);
                return date.toLocaleString('en-US', {
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
            };

            const getTotalHours = () => {
                let filteredTasks = tasks;
                if (activeTab !== 'overview' && activeTab !== 'week') {
                    filteredTasks = tasks.filter(task => task.project === activeTab);
                }
                const total = filteredTasks.reduce((sum, task) => sum + task.time, 0);
                return formatTime(total);
            };

            const openModal = (task = null) => {
                if (task) {
                    setEditingTask(task);
                    setFormData({
                        name: task.name,
                        project: task.project,
                        start: task.start,
                        end: task.end
                    });
                } else {
                    setEditingTask(null);
                    const now = new Date();
                    setFormData({
                        name: '',
                        project: Object.keys(modules)[0],
                        start: now.toISOString().slice(0, 16),
                        end: ''
                    });
                }
                setShowModal(true);
            };

            const closeModal = () => {
                setShowModal(false);
                setEditingTask(null);
                setFormData({ name: '', project: 'Project 1', start: '', end: '' });
            };

            const handleSubmit = (e) => {
                e.preventDefault();

                const startTime = new Date(formData.start);
                const endTime = formData.end ? new Date(formData.end) : new Date();
                const timeInSeconds = Math.floor((endTime - startTime) / 1000);

                if (editingTask) {
                    setTasks(tasks.map(task =>
                        task.id === editingTask.id
                            ? { ...task, ...formData, time: timeInSeconds }
                            : task
                    ));
                } else {
                    const newTask = {
                        id: Date.now(),
                        ...formData,
                        time: timeInSeconds
                    };
                    setTasks([...tasks, newTask]);
                }

                closeModal();
            };

            const startTimer = () => {
                const now = new Date();
                const startISO = now.toISOString().slice(0, 16);

                setActiveTimer({
                    startTime: Date.now(),
                    elapsed: 0,
                    start: startISO,
                    taskName: '',
                    project: Object.keys(modules)[0],
                    isPaused: false,
                    pausedElapsed: 0
                });
            };

            const pauseTimer = () => {
                if (activeTimer && !activeTimer.isPaused) {
                    // Pausing: save current elapsed time
                    setActiveTimer(prev => ({
                        ...prev,
                        isPaused: true,
                        pausedElapsed: prev.elapsed
                    }));
                } else if (activeTimer && activeTimer.isPaused) {
                    // Resuming: restart the startTime
                    setActiveTimer(prev => ({
                        ...prev,
                        isPaused: false,
                        startTime: Date.now()
                    }));
                }
            };

            const stopTimer = () => {
                if (activeTimer) {
                    const now = new Date();
                    const endISO = now.toISOString().slice(0, 16);

                    setFormData({
                        name: activeTimer.taskName || 'Timed Task',
                        project: activeTimer.project,
                        start: activeTimer.start,
                        end: endISO
                    });

                    setActiveTimer(null);
                    setShowModal(true);
                }
            };

            const updateTimerInfo = (field, value) => {
                if (activeTimer) {
                    setActiveTimer(prev => ({
                        ...prev,
                        [field]: value
                    }));
                }
            };

            const deleteTask = (id) => {
                if (confirm('Delete this task?')) {
                    setTasks(tasks.filter(task => task.id !== id));
                }
            };

            // Export data to JSON file
            const exportData = () => {
                const data = {
                    tasks: tasks,
                    archivedWeeks: archivedWeeks,
                    exportDate: new Date().toISOString(),
                    version: 1
                };

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `time-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showPWAStatus('Data exported successfully!');
            };

            // Import data from JSON file
            const importData = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);

                        if (data.tasks && Array.isArray(data.tasks)) {
                            setTasks(data.tasks);
                        }
                        if (data.archivedWeeks && Array.isArray(data.archivedWeeks)) {
                            setArchivedWeeks(data.archivedWeeks);
                        }

                        showPWAStatus(`Data imported! ${data.tasks.length} tasks restored.`);
                    } catch (error) {
                        console.error('Error importing data:', error);
                        alert('Error importing data. Please check the file format.');
                    }
                };
                reader.readAsText(file);
            };

            // Clear all data (for debugging)
            const clearAllData = async () => {
                if (confirm('Are you sure you want to clear ALL data? This cannot be undone!')) {
                    setTasks([]);
                    setArchivedWeeks([]);
                    await timeTrackerDB.clearAllData();
                    showPWAStatus('All data cleared!');
                }
            };

            // Toggle edit layout mode
            const toggleEditMode = () => {
                const newMode = !editLayoutMode;
                setEditLayoutMode(newMode);
                setHamburgerMenuOpen(false);
                if (newMode) {
                    showPWAStatus('Edit mode: Click arrows to rearrange sections');
                } else {
                    showPWAStatus('Edit mode disabled');
                }
            };

            // Swap two sections in the layout
            const swapSections = (index1, index2) => {
                const newOrder = [...sectionOrder];
                [newOrder[index1], newOrder[index2]] = [newOrder[index2], newOrder[index1]];
                setSectionOrder(newOrder);
                localStorage.setItem('sectionOrder', JSON.stringify(newOrder));
                showPWAStatus('Layout updated!');
            };

            const getModuleColor = (moduleName) => {
                return modules[moduleName]?.color || '#95a5a6';
            };

            const getModuleShortName = (moduleName) => {
                const shortNames = {
                    // Informatik modules
                    'Diskrete Strukturen': 'DS',
                    'Analysis für Informatik': 'Analysis',
                    'Programmierung': 'Prog',
                    'Technische Informatik': 'TI',
                    'Mentoring Informatik': 'Mentoring',
                    // Maschinenbau modules
                    'Buchführung und Internes Rechnungswesen': 'Buchführung',
                    'Entscheidungslehre': 'Entscheidung',
                    'Maschinengestaltung I': 'Masch.gest. I',
                    'Mathematik I': 'Mathe I',
                    'Mechanik I': 'Mechanik I',
                    'Physik': 'Physik'
                };
                return shortNames[moduleName] || moduleName;
            };

            // Render a section with optional edit controls
            const renderSectionWithControls = (sectionId, sectionContent, sectionIndex) => {
                return (
                    <div key={sectionId} style={{position: 'relative'}}>
                        {editLayoutMode && (
                            <div style={{
                                position: 'absolute',
                                top: '10px',
                                right: '10px',
                                zIndex: 100,
                                display: 'flex',
                                gap: '8px',
                                background: 'rgba(255, 255, 255, 0.95)',
                                padding: '8px',
                                borderRadius: '6px',
                                boxShadow: '0 2px 8px rgba(0,0,0,0.15)',
                                border: '2px solid #2196f3'
                            }}>
                                <button
                                    onClick={() => swapSections(sectionIndex, sectionIndex - 1)}
                                    disabled={sectionIndex === 0}
                                    style={{
                                        padding: '6px 12px',
                                        background: sectionIndex === 0 ? '#e0e0e0' : '#2196f3',
                                        color: sectionIndex === 0 ? '#999' : 'white',
                                        border: 'none',
                                        borderRadius: '4px',
                                        cursor: sectionIndex === 0 ? 'not-allowed' : 'pointer',
                                        fontSize: '14px',
                                        fontWeight: '600'
                                    }}
                                >
                                    ↑ Move Up
                                </button>
                                <button
                                    onClick={() => swapSections(sectionIndex, sectionIndex + 1)}

                                                                        border: 'none',
                                                                        textAlign: 'left',
                                                                        fontSize: '14px',
                                                                        cursor: 'pointer',
                                                                        display: 'flex',
                                                                        alignItems: 'center',
                                                                        gap: '8px',
                                                                        color: '#dc3545'
                                                                    }}
                                                                    onMouseEnter={(e) => {
                                                                        e.target.style.background = '#fff5f5';
                                                                    }}
                                                                    onMouseLeave={(e) => {
                                                                        e.target.style.background = 'transparent';
                                                                    }}
                                                                    onClick={() => deleteArchivedWeek(week)}
                                                                >
                                                                    <span>🗑️</span> Delete Week
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                )}
                            </div>
                        )}
                                </div>
                                </div>
                            )}
                        </div>
                    </div>,
                        0
                    )}

                    {/* Render the second widget below (whichever isn't next to the chart) */}
                    {renderSectionWithControls(
                        sectionOrder[1],
                        sectionOrder[1] === 'timer' ? (
                            // Timer as full-width section below
                            <div className="timer-section">
                                <div style={{maxWidth: '600px', margin: '0 auto'}}>
                                {activeTimer ? (
                                    <div style={{
                                        background: activeTimer.isPaused ? '#fff3cd' : '#d4edda',
                                        border: activeTimer.isPaused ? '2px solid #ffeeba' : '2px solid #c3e6cb',
                                        borderRadius: '12px',
                                        padding: '25px'
                                    }}>
                                        <h3 style={{
                                            fontSize: '18px',
                                            fontWeight: '600',
                                            marginBottom: '20px',
                                            color: activeTimer.isPaused ? '#856404' : '#155724',
                                            textAlign: 'center'
                                        }}>
                                            Active Timer
                                        </h3>
                                        <div style={{
                                            fontSize: '48px',
                                            fontWeight: '300',
                                            fontFamily: '"Courier New", monospace',
                                            color: activeTimer.isPaused ? '#856404' : '#155724',
                                            textAlign: 'center',
                                            marginBottom: '8px'
                                        }}>
                                            {formatTime(activeTimer.elapsed)}
                                        </div>
                                        {activeTimer.isPaused && (
                                            <div style={{
                                                fontSize: '14px',
                                                fontWeight: '600',
                                                color: '#856404',
                                                textAlign: 'center',
                                                marginBottom: '15px'
                                            }}>
                                                PAUSED
                                            </div>
                                        )}
                                        <div style={{
                                            display: 'flex',
                                            flexDirection: 'column',
                                            gap: '12px',
                                            marginTop: '20px'
                                        }}>
                                            <div>
                                                <input
                                                    type="text"
                                                    value={activeTimer.taskName}
                                                    onChange={(e) => updateTimerInfo('taskName', e.target.value)}
                                                    placeholder="What are you working on?"
                                                    style={{
                                                        width: '100%',
                                                        padding: '10px 12px',
                                                        border: '1px solid #ccc',
                                                        borderRadius: '4px',
                                                        fontSize: '14px'
                                                    }}
                                                />
                                            </div>
                                            <div>
                                                <select
                                                    value={activeTimer.project}
                                                    onChange={(e) => updateTimerInfo('project', e.target.value)}
                                                    style={{
                                                        width: '100%',
                                                        padding: '10px 12px',
                                                        border: '1px solid #ccc',
                                                        borderRadius: '4px',
                                                        fontSize: '14px'
                                                    }}
                                                >
                                                    {Object.keys(modules).map(moduleName => (
                                                        <option key={moduleName} value={moduleName}>{moduleName}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div style={{
                                                display: 'flex',
                                                gap: '8px',
                                                marginTop: '10px'
                                            }}>
                                                <button
                                                    onClick={pauseTimer}
                                                    style={{
                                                        flex: 1,
                                                        padding: '12px',
                                                        background: activeTimer.isPaused ? '#28a745' : '#ffc107',
                                                        color: activeTimer.isPaused ? 'white' : '#000',
                                                        border: 'none',
                                                        borderRadius: '6px',
                                                        fontSize: '14px',
                                                        fontWeight: '600',
                                                        cursor: 'pointer'
                                                    }}
                                                >
                                                    {activeTimer.isPaused ? '▶ Resume' : '⏸ Pause'}
                                                </button>
                                                <button
                                                    onClick={stopTimer}
                                                    style={{
                                                        flex: 1,
                                                        padding: '12px',
                                                        background: '#dc3545',
                                                        color: 'white',
                                                        border: 'none',
                                                        borderRadius: '6px',
                                                        fontSize: '14px',
                                                        fontWeight: '600',
                                                        cursor: 'pointer'
                                                    }}
                                                >
                                                    ⏹ Stop
                                                </button>
                                            </div>
                                            <div style={{
                                                fontSize: '12px',
                                                color: '#666',
                                                textAlign: 'center',
                                                marginTop: '8px'
                                            }}>
                                                Started: {new Date(activeTimer.start).toLocaleTimeString('en-US', {
                                                    hour: 'numeric',
                                                    minute: '2-digit',
                                                    hour12: true
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div style={{
                                        display: 'flex',
                                        flexDirection: 'column',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        height: '280px',
                                        border: '2px dashed #ddd',
                                        borderRadius: '12px'
                                    }}>
                                        <div style={{
                                            fontSize: '48px',
                                            marginBottom: '15px',
                                            opacity: 0.3
                                        }}>⏱️</div>
                                        <h3 style={{
                                            fontSize: '18px',
                                            fontWeight: '500',
                                            color: '#666',
                                            marginBottom: '20px'
                                        }}>
                                            No Active Timer
                                        </h3>
                                        <button
                                            onClick={startTimer}
                                            style={{
                                                padding: '12px 24px',
                                                background: '#28a745',
                                                color: 'white',
                                                border: 'none',
                                                borderRadius: '6px',
                                                fontSize: '16px',
                                                fontWeight: '600',
                                                cursor: 'pointer'
                                            }}
                                        >
                                            ▶ Start Timer
                                        </button>
                                    </div>
                                )}
                                </div>
                            </div>
                        ) : (
                            // Task-list as full-width section below
                            <div className="bg-white rounded-xl p-8 shadow-md hover:shadow-lg transition-shadow duration-200">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px'}}>
                            <h2 className="section-title" style={{marginBottom: 0}}>
                                Task List
                            </h2>
                            <div style={{fontSize: '12px', color: '#666', display: 'flex', gap: '15px'}}>
                                <span>Tasks: {tasks.length}</span>
                                <span>Archived: {archivedWeeks.length}</span>
                            </div>
                        </div>

                        <div className="task-controls">
                            <button onClick={() => openModal()} className="primary">+ New Task</button>
                            <button onClick={() => setViewMode('current')} className={viewMode === 'current' ? 'active' : ''}>
                                Current Week
                            </button>
                            <button onClick={() => setViewMode('archive')} className={viewMode === 'archive' ? 'active' : ''}>
                                Archive
                            </button>
                            <button onClick={archiveCurrentWeek} style={{marginLeft: 'auto'}}>
                                Archive Week
                            </button>
                        </div>

                        {viewMode === 'current' ? (
                            <table className="task-table">
                                <thead>
                                    <tr>
                                        <th>Event</th>
                                        <th>Project</th>
                                        <th>Time invested</th>
                                        <th>Start</th>
                                        <th>End</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {tasks.map(task => (
                                        <tr key={task.id}>
                                            <td>{task.name}</td>
                                            <td>
                                                <span
                                                    className="project-tag"
                                                    style={{
                                                        background: `${getModuleColor(task.project)}20`,
                                                        color: getModuleColor(task.project),
                                                        border: `1px solid ${getModuleColor(task.project)}40`
                                                    }}
                                                >
                                                    {task.project}
                                                </span>
                                            </td>
                                            <td>{formatTime(task.time)}</td>
                                            <td>{formatDateTime(task.start)}</td>
                                            <td>{formatDateTime(task.end)}</td>
                                            <td>
                                                <button onClick={() => openModal(task)} style={{marginRight: '5px'}}>Edit</button>
                                                <button onClick={() => deleteTask(task.id)}>Delete</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : (
                            <div className="archive-view">
                                <h3 style={{fontSize: '18px', marginBottom: '20px', color: '#333'}}>
                                    Archived Weeks
                                </h3>
                                {archivedWeeks.length === 0 ? (
                                    <div style={{
                                        textAlign: 'center',
                                        padding: '60px 20px',
                                        color: '#999',
                                        fontSize: '16px'
                                    }}>
                                        No archived weeks yet
                                    </div>
                                ) : (
                                    <div style={{display: 'flex', flexDirection: 'column', gap: '15px'}}>
                                    {archivedWeeks.map(week => (
                                        <div
                                            key={week.id}
                                            style={{
                                                border: '1px solid #ddd',
                                                borderRadius: '8px',
                                                padding: '20px',
                                                background: 'white'
                                            }}
                                        >
                                            <div style={{
                                                display: 'flex',
                                                justifyContent: 'space-between',
                                                alignItems: 'flex-start',
                                                marginBottom: '15px'
                                            }}>
                                                <div>
                                                    <h4 style={{margin: '0 0 5px 0', fontSize: '16px', fontWeight: '600'}}>
                                                        KW {week.kw} - {week.year}
                                                    </h4>
                                                    <div style={{fontSize: '13px', color: '#666'}}>
                                                        {week.tasks.length} tasks • Total: {formatTime(week.totalTime)}
                                                    </div>
                                                </div>
                                                <div style={{position: 'relative'}}>
                                                    <button
                                                        onClick={() => setOpenMenuWeekId(openMenuWeekId === week.id ? null : week.id)}
                                                        style={{
                                                            background: 'transparent',
                                                            border: '1px solid #ddd',
                                                            borderRadius: '4px',
                                                            padding: '4px 8px',
                                                            cursor: 'pointer',
                                                            fontSize: '16px',
                                                            lineHeight: '1'
                                                        }}
                                                    >
                                                        ⋮
                                                    </button>
                                                    {openMenuWeekId === week.id && (
                                                        <div style={{
                                                            position: 'absolute',
                                                            right: 0,
                                                            top: '100%',
                                                            marginTop: '4px',
                                                            background: 'white',
                                                            border: '1px solid #ddd',
                                                            borderRadius: '6px',
                                                            boxShadow: '0 4px 12px rgba(0,0,0,0.15)',
                                                            minWidth: '180px',
                                                            zIndex: 1000,
                                                            overflow: 'hidden'
                                                        }}>
                                                            {week.kw === getCurrentWeek() && week.year === new Date().getFullYear() && (
                                                                <button
                                                                    style={{
                                                                        width: '100%',
                                                                        padding: '10px 16px',
                                                                        background: 'transparent',
                                                                        border: 'none',
                                                                        borderBottom: '1px solid #eee',
                                                                        textAlign: 'left',
                                                                        fontSize: '14px',
                                                                        cursor: 'pointer',
                                                                        display: 'flex',
                                                                        alignItems: 'center',
                                                                        gap: '8px'
                                                                    }}
                                                                    onMouseEnter={(e) => e.target.style.background = '#f0f0f0'}
                                                                    onMouseLeave={(e) => e.target.style.background = 'transparent'}
                                                                    onClick={() => unarchiveWeek(week)}
                                                                >
                                                                    <span>↩</span> Unarchive Week
                                                                </button>
                                                            )}
                                                            <button
                                                                style={{
                                                                    width: '100%',
                                                                    padding: '10px 16px',
                                                                    background: 'transparent',
                                                                    border: 'none',
                                                                    textAlign: 'left',
                                                                    fontSize: '14px',
                                                                    cursor: 'pointer',
                                                                    display: 'flex',
                                                                    alignItems: 'center',
                                                                    gap: '8px',
                                                                    color: '#dc3545'
                                                                }}
                                                                onMouseEnter={(e) => {
                                                                    e.target.style.background = '#fff5f5';
                                                                }}
                                                                onMouseLeave={(e) => {
                                                                    e.target.style.background = 'transparent';
                                                                }}
                                                                onClick={() => deleteArchivedWeek(week)}
                                                            >
                                                                <span>🗑️</span> Delete Week
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                )}
                            </div>
                        )}
                    </div>
                        ),
                        1
                    )}

                    <div className={`${showModal ? 'flex' : 'hidden'} fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50`}>
                        <div className="bg-white rounded-xl p-8 w-11/12 max-w-lg shadow-2xl">
                            <h2 className="text-2xl font-semibold mb-5 text-gray-900">{editingTask ? 'Edit Task' : 'New Task'}</h2>
                            <form onSubmit={handleSubmit}>
                                <div className="mb-5">
                                    <label className="block mb-2 font-medium text-sm text-gray-800">Task Name</label>
                                    <input
                                        type="text"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent transition-all"
                                        value={formData.name}
                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                        required
                                    />
                                </div>
                                <div className="mb-5">
                                    <label className="block mb-2 font-medium text-sm text-gray-800">Project</label>
                                    <select
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent transition-all"
                                        value={formData.project}
                                        onChange={(e) => setFormData({...formData, project: e.target.value})}
                                    >
                                        {Object.keys(modules).map(moduleName => (
                                            <option key={moduleName} value={moduleName}>{moduleName}</option>
                                        ))}
                                    </select>
                                </div>
                                <div className="mb-5">
                                    <label className="block mb-2 font-medium text-sm text-gray-800">Start Time</label>
                                    <input
                                        type="datetime-local"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent transition-all"
                                        value={formData.start}
                                        onChange={(e) => setFormData({...formData, start: e.target.value})}
                                        required
                                    />
                                </div>
                                <div className="mb-5">
                                    <label className="block mb-2 font-medium text-sm text-gray-800">End Time</label>
                                    <input
                                        type="datetime-local"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent transition-all"
                                        value={formData.end}
                                        onChange={(e) => setFormData({...formData, end: e.target.value})}
                                    />
                                </div>
                                <div className="flex gap-3 justify-end mt-6">
                                    <button type="button" className="px-5 py-2 bg-gray-100 text-gray-800 rounded-lg hover:bg-gray-200 font-medium transition-colors" onClick={closeModal}>Cancel</button>
                                    <button type="submit" className="px-5 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900 font-medium transition-colors shadow-md">
                                        {editingTask ? 'Update' : 'Create'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<TimeTracker />, document.getElementById('root'));
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered successfully:', registration.scope);

                        // Show status message
                        const statusEl = document.getElementById('pwa-status');
                        if (statusEl) {
                            statusEl.textContent = 'App ready for offline use!';
                            statusEl.classList.add('show');
                            setTimeout(() => {
                                statusEl.classList.remove('show');
                            }, 3000);
                        }
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
